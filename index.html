<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exploring Nature - Responsive Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Wonders of the Wilderness</h1>
    <p>A responsive gallery showcasing the untamed beauty of national parks across different seasons.</p>
  </header>

  <main id="gallery">
    <figure>
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&auto=format&fit=crop&q=80" alt="Serene river winding through Yosemite Valley during sunrise">
      <figcaption>Yosemite Valley captures radiant morning light casting deep golden hues across granite cliffs.</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600&auto=format&fit=crop&q=80" alt="Solo hiker standing atop a mountain ridge overlooking green valleys">
      <figcaption>Ridge summits offer sweeping panoramic vistas of untouched evergreen forests below.</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1434725039720-aaad6dd32dfe?w=600&auto=format&fit=crop&q=80" alt="Lush green meadow surrounded by tall pine trees and distant snowy peaks">
      <figcaption>Alpine meadows burst into vibrant color as glacier snow melts under early summer warmth.</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600&auto=format&fit=crop&q=80" alt="Dramatic turquoise lake nestled between steep rocky mountains">
      <figcaption>Crystal-clear glacial waters mirror towering limestone peaks in absolute stillness.</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=600&auto=format&fit=crop&q=80" alt="Sunlight filtering through thick autumn canopy illuminating a forest footbridge">
      <figcaption>Dappled sunlight filters through golden leaves along peaceful woodland walking trails.</figcaption>
    </figure>
  </main>


</body>
</html>
